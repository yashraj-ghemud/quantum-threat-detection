random_seed: 42
simulator:
  backend: aer_simulator
  shots: 1024
  max_parallel_threads: 4
measurement_bases:
  X: x
  Y: y
  Z: z
logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
  date_format: '%Y-%m-%dT%H:%M:%S'
  log_to_file: false
  log_file: logs/qtd.log
circuit:
  num_qubits: 2
  barrier: true
evaluation:
  n_legitimate_sessions: 300
  n_attack_sessions_per_type: 300
  confidence_level: 0.95
  interval_method: clopper_pearson
  signature_length: 32
  n_baseline_sessions: 40
phases:
  phase0_foundation: true
  phase1_bell_states: true
  phase2_teleportation: true
  phase2_5_noise: true
  phase3_qds: true
  phase4_detection: true
  phase5_attacks: false
  phase6_security: false
  phase7_performance: false
  phase8_dashboard: false
  phase9_integration: false
detection:
  warning_threshold: 0.018766
  critical_threshold: 0.046916
  calibrated_by: experiments/run_final_experiment.py
  calibrated_at: '2026-09-23T12:33:34.892886+00:00'
  calibrated_for_signature_length: 16
  calibrated_for_shots: 256
