<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QVeris Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1E2440; --ink2: #5A6384; --lav: #8C84F0; --mint: #4FC3A1; --sky: #6FA8F0; --coral: #E8697A; --peach: #F4A77A; --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EAEDF7; color: var(--ink); font-family: Inter, system-ui, sans-serif; cursor: none; }
  @media (pointer: coarse) { html, body { cursor: auto; } }
  #view { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; }
  #stage { position: absolute; inset: 0; } #stage canvas { width: 100% !important; height: 100% !important; }
  .glass { background: rgba(243,244,251,.8); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.65); box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 20px 50px -24px rgba(76,70,160,.4); border-radius: 18px; }
  #head { position: absolute; left: 18px; top: 16px; padding: 12px 16px; max-width: 56%; }
  #title { font: 700 12px "JetBrains Mono", monospace; letter-spacing: .24em; color: var(--lav); }
  #sub { font: 700 20px "Space Grotesk", sans-serif; letter-spacing: -.02em; margin-top: 4px; }
  #rows { position: absolute; right: 18px; top: 16px; width: 270px; padding: 12px 16px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(30,36,64,.06); }
  .row:last-child { border: 0; }
  .row span { font: 600 11px Inter, sans-serif; color: var(--ink2); letter-spacing: .05em; text-transform: uppercase; }
  .row b { font: 700 14px "JetBrains Mono", monospace; transition: color .4s; }
  .row b.good { color: #2E9E7F; } .row b.bad { color: #D04E61; } .row b.warn { color: #C0703F; }
  #note { position: absolute; left: 18px; bottom: 16px; max-width: min(560px, 66%); padding: 10px 14px; font: 500 12px/1.55 "JetBrains Mono", monospace; }
  #note .h { font: 700 10.5px "JetBrains Mono", monospace; letter-spacing: .18em; color: var(--lav); display: block; margin-bottom: 4px; }
  #hint { position: absolute; right: 18px; bottom: 16px; font: 500 11px "JetBrains Mono", monospace; color: var(--ink2); }
  #badge { position: absolute; left: 18px; top: 100px; transform: translateY(-6px); padding: 8px 18px; border-radius: 999px; font: 700 15px "Space Grotesk", sans-serif; opacity: 0; transition: all .6s var(--ease); }
  #badge.on { opacity: 1; transform: none; }
  #badge.ok { background: rgba(79,195,161,.18); color: #2E9E7F; } #badge.bad { background: rgba(232,105,122,.16); color: #D04E61; }
  @media (max-width: 760px) { #rows { width: 190px; } #head { max-width: 50%; } #note { max-width: 92%; bottom: 44px; } }
</style>
<!--QV_HEAD-->
</head>
<body>
<div id="view">
  <div id="stage"></div>
  <div id="head" class="glass"><div id="title"></div><div id="sub"></div></div>
  <div id="badge"></div>
  <div id="rows" class="glass"></div>
  <div id="note" class="glass"></div>
  <div id="hint">drag to orbit</div>
</div>
<!--QV_SCRIPT-->
</body>
</html>
